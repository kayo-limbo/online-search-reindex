services:
  postgres:
    image: ${POSTGRES_TEST_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_PASSWORD: baseline-only
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
      interval: 1s
      timeout: 3s
      retries: 60
  typesense:
    image: typesense/typesense:29.0
    command: ["--data-dir=/data", "--api-key=baseline-only"]
    tmpfs:
      - /data
    ports:
      - "127.0.0.1::8108"
